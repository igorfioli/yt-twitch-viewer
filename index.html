<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DUOCAST — YouTube + Twitch</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0a0a0c;
    --panel:#101013;
    --panel-2:#151519;
    --hairline:#1f2025;
    --text:#ececee;
    --text-dim:#6b6f76;
    --yt:#ff0000;
    --yt-dim:#cc0000;
    --twitch:#9146ff;
    --twitch-dim:#5c2ba8;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--void);
    color:var(--text);
    font-family:'Inter',sans-serif;
    overflow:hidden;
  }
  ::selection{background:var(--twitch);color:#fff;}

  /* ---------- layout skeleton ---------- */
  #stage{
    position:fixed;inset:0;
    display:flex;
    flex-direction:row;
  }
  #yt-pane{
    flex:0 0 68%;
    position:relative;
    background:#000;
    border-right:1px solid var(--hairline);
    min-width:0;
  }
  #twitch-pane{
    flex:1 1 auto;
    position:relative;
    background:var(--panel);
    min-width:0;
  }
  #yt-frame, #twitch-frame{
    width:100%;height:100%;border:0;display:block;
  }

  /* the seam: a live signal-merge indicator between panes */
  #seam{
    position:absolute;
    top:0;bottom:0;
    left:68%;
    width:2px;
    transform:translateX(-1px);
    z-index:5;
    pointer-events:none;
    background:linear-gradient(180deg, var(--yt) 0%, var(--hairline) 45%, var(--hairline) 55%, var(--twitch) 100%);
    opacity:.65;
  }

  /* ---------- empty-state placeholders ---------- */
  .placeholder{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:10px;
    color:var(--text-dim);
    font-family:'JetBrains Mono',monospace;
    text-align:center;
    padding:0 24px;
    background:var(--panel);
  }
  .placeholder .glyph{
    font-size:13px;
    letter-spacing:.14em;
    text-transform:uppercase;
  }
  .placeholder .glyph.yt-c{color:var(--yt-dim);}
  .placeholder .glyph.twitch-c{color:var(--twitch-dim);}
  .placeholder .sub{font-size:12px;color:var(--text-dim);max-width:320px;line-height:1.6;}
  .hidden{display:none !important;}

  /* ---------- top control deck ---------- */
  #hotzone{
    position:fixed;top:0;left:0;right:0;height:14px;z-index:30;
  }
  #deck{
    position:fixed;
    top:0;left:0;right:0;
    z-index:20;
    display:flex;
    align-items:stretch;
    background:rgba(10,10,12,.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--hairline);
    transform:translateY(-100%);
    transition:transform .28s cubic-bezier(.4,0,.2,1);
    font-family:'JetBrains Mono',monospace;
  }
  #deck.visible{transform:translateY(0);}

  .deck-brand{
    display:flex;align-items:center;
    padding:0 18px;
    font-size:13px;
    font-weight:700;
    letter-spacing:.12em;
    color:var(--text);
    border-right:1px solid var(--hairline);
    white-space:nowrap;
  }
  .deck-brand .dot-y{color:var(--yt);}
  .deck-brand .dot-t{color:var(--twitch);}

  .deck-channel{
    flex:1 1 0;
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 16px;
    min-width:0;
    border-right:1px solid var(--hairline);
  }

  .deck-label{
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--text-dim);
    white-space:nowrap;
    display:flex;align-items:center;gap:6px;
  }
  .led{width:6px;height:6px;border-radius:50%;background:var(--text-dim);flex:none;}
  .led.on-yt{background:var(--yt);box-shadow:0 0 6px var(--yt);}
  .led.on-twitch{background:var(--twitch);box-shadow:0 0 6px var(--twitch);}

  .deck-channel input[type="text"]{
    flex:1 1 auto;
    min-width:60px;
    background:var(--panel-2);
    border:1px solid var(--hairline);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:8px 10px;
    border-radius:3px;
    outline:none;
    transition:border-color .15s;
  }
  #yt-input:focus{border-color:var(--yt-dim);}
  #twitch-input:focus{border-color:var(--twitch-dim);}
  .deck-channel input[type="text"]::placeholder{color:var(--text-dim);}

  .deck-action-group{
    display:flex;
    align-items:center;
    padding:0 16px;
    gap:10px;
    border-right:1px solid var(--hairline);
  }

  .deck-go{
    flex:none;
    background:var(--text);
    border:1px solid var(--text);
    color:var(--void);
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:0 20px;
    height:34px;
    border-radius:3px;
    cursor:pointer;
    transition:all .15s;
    white-space:nowrap;
  }
  .deck-go:hover:not(:disabled){background:transparent;color:var(--text);}
  .deck-go:disabled{opacity:0.6;cursor:not-allowed;}

  .deck-aux{
    display:flex;align-items:center;
    padding:0 16px;
    gap:10px;
  }
  #pin-btn{
    background:transparent;
    border:1px solid var(--hairline);
    color:var(--text-dim);
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    padding:8px 12px;
    border-radius:3px;
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s;
  }
  #pin-btn:hover{color:var(--text);border-color:var(--text-dim);}
  #pin-btn.active{color:var(--void);background:var(--text);border-color:var(--text);}

  /* peek tab shown when deck is hidden */
  #peek{
    position:fixed;top:0;left:50%;transform:translateX(-50%);
    z-index:19;
    background:rgba(10,10,12,.85);
    border:1px solid var(--hairline);
    border-top:none;
    color:var(--text-dim);
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    letter-spacing:.12em;
    text-transform:uppercase;
    padding:4px 14px 5px;
    border-radius:0 0 6px 6px;
    pointer-events:none;
    opacity:.8;
  }
  #deck.visible ~ #peek{display:none;}

  @media (max-width: 760px){
    #stage{flex-direction:column;}
    #yt-pane{flex:0 0 55%;border-right:none;border-bottom:1px solid var(--hairline);}
    #twitch-pane{flex:1 1 auto;}
    #seam{left:0;right:0;top:55%;bottom:auto;height:2px;width:auto;
      background:linear-gradient(90deg, var(--yt) 0%, var(--hairline) 45%, var(--hairline) 55%, var(--twitch) 100%);}
    #deck{flex-wrap:wrap;}
    .deck-brand{width:100%;border-right:none;border-bottom:1px solid var(--hairline);}
    .deck-channel{flex:1 1 100%;border-right:none;border-bottom:1px solid var(--hairline);}
    .deck-action-group{width:100%;border-right:none;border-bottom:1px solid var(--hairline);padding:10px 16px;justify-content:center;}
    .deck-aux{width:100%;justify-content:center;padding:10px 16px;}
  }
</style>
</head>
<body>

<div id="stage">
  <div id="yt-pane">
    <iframe id="yt-frame" class="hidden" allow="autoplay; fullscreen; encrypted-media" title="YouTube stream"></iframe>
    <div id="yt-placeholder" class="placeholder">
      <div class="glyph yt-c">YouTube — Sinal de vídeo</div>
      <div class="sub">Digite o <b>@nome</b> do canal (ou cole o link) ali em cima para carregar a live atual.</div>
    </div>
  </div>
  <div id="twitch-pane">
    <iframe id="twitch-frame" class="hidden" title="Twitch chat"></iframe>
    <div id="twitch-placeholder" class="placeholder">
      <div class="glyph twitch-c">Twitch — Comentários</div>
      <div class="sub">Digite o nome do canal na Twitch ali em cima.</div>
    </div>
  </div>
  <div id="seam"></div>
</div>

<div id="hotzone"></div>
<div id="peek">passe o mouse aqui em cima</div>

<div id="deck">
  <div class="deck-brand"><span class="dot-y">YOUTUBE</span>&nbsp;/&nbsp;<span class="dot-t">TWITCH</span></div>

  <div class="deck-channel">
    <span class="deck-label"><span class="led" id="yt-led"></span>YouTube</span>
    <input type="text" id="yt-input" placeholder="nome do canal (ex: @cazetv) ou link" autocomplete="off" spellcheck="false">
  </div>

  <div class="deck-channel">
    <span class="deck-label"><span class="led" id="twitch-led"></span>Twitch</span>
    <input type="text" id="twitch-input" placeholder="nome do canal" autocomplete="off" spellcheck="false">
  </div>

  <div class="deck-action-group">
    <button class="deck-go" id="load-all-btn">Carregar</button>
  </div>

  <div class="deck-aux">
    <button id="pin-btn" title="Manter a barra sempre visível">Fixar barra</button>
  </div>
</div>

<script>
(function(){
  var ytFrame = document.getElementById('yt-frame');
  var twitchFrame = document.getElementById('twitch-frame');
  var ytPlaceholder = document.getElementById('yt-placeholder');
  var twitchPlaceholder = document.getElementById('twitch-placeholder');
  var ytInput = document.getElementById('yt-input');
  var twitchInput = document.getElementById('twitch-input');
  var loadAllBtn = document.getElementById('load-all-btn');
  var ytLed = document.getElementById('yt-led');
  var twitchLed = document.getElementById('twitch-led');
  var deck = document.getElementById('deck');
  var hotzone = document.getElementById('hotzone');
  var pinBtn = document.getElementById('pin-btn');

  var pinned = localStorage.getItem('duocast_pinned') === '1';
  var hideTimer = null;

  async function resolveYTInput(input) {
    var str = input.trim();
    if (!str) return null;

    // 1. Links diretos do YouTube ou Video ID puro (11 caracteres)
    var match = str.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|live\/))([a-zA-Z0-9_-]{11})/);
    if (match) return { type: 'video', id: match[1] };
    if (/^[a-zA-Z0-9_-]{11}$/.test(str)) return { type: 'video', id: str };

    // 2. ID de canal puro (UC...)
    if (/^UC[\w-]{22}$/.test(str)) return { type: 'channel', id: str };

    // 3. Resolve @handle / nome / URL de canal usando a API atual da DecAPI.
    var handle = null;

    try {
      var url = new URL(str);
      var host = url.hostname.toLowerCase();

      if (host === 'youtube.com' || host === 'www.youtube.com' || host === 'm.youtube.com') {
        var path = url.pathname;

        var handleMatch = path.match(/^\/@([^\/?#]+)/);
        if (handleMatch) handle = '@' + decodeURIComponent(handleMatch[1]);

        var channelMatch = path.match(/^\/channel\/(UC[\w-]{22})/);
        if (channelMatch) return { type: 'channel', id: channelMatch[1] };

        var userMatch = path.match(/^\/user\/([^\/?#]+)/);
        if (userMatch) handle = decodeURIComponent(userMatch[1]);
      }
    } catch (e) {
      // Não é uma URL completa; trata como nome/handle abaixo.
    }

    if (!handle) {
      handle = str.replace(/^@/, '').trim();
      if (!handle) return null;
      handle = '@' + handle;
    }

    try {
      var apiURL =
        'https://decapi.me/youtube/latest_video' +
        '?handle=' + encodeURIComponent(handle) +
        '&format=%7Bid%7D' +
        '&no_shorts=1';

      var response = await fetch(apiURL, {
        method: 'GET',
        cache: 'no-store'
      });

      if (!response.ok) throw new Error('HTTP ' + response.status);

      var videoId = (await response.text()).trim();

      if (/^[a-zA-Z0-9_-]{11}$/.test(videoId)) {
        return { type: 'video', id: videoId };
      }

      return {
        type: 'error',
        msg: 'Não foi possível encontrar um vídeo/live para o canal ' + handle + '.'
      };
    } catch (e) {
      return {
        type: 'error',
        msg: 'Falha ao consultar o YouTube. A API de resolução pode estar temporariamente indisponível.'
      };
    }
  }

  function sanitizeTwitch(name){
    return name.trim().replace(/^@/, '').replace(/https?:\/\/[^\/]+\//, '').replace(/[^a-zA-Z0-9_]/g, '');
  }

  function showDeck(){
    clearTimeout(hideTimer);
    deck.classList.add('visible');
  }
  function scheduleHide(){
    if (pinned) return;
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function(){
      if (document.activeElement === ytInput || document.activeElement === twitchInput) return;
      deck.classList.remove('visible');
    }, 180);
  }

  hotzone.addEventListener('mouseenter', showDeck);
  deck.addEventListener('mouseenter', showDeck);
  deck.addEventListener('mouseleave', scheduleHide);
  hotzone.addEventListener('mouseleave', function(){
    setTimeout(function(){
      if (!deck.matches(':hover')) scheduleHide();
    }, 30);
  });

  ytInput.addEventListener('focus', showDeck);
  twitchInput.addEventListener('focus', showDeck);
  ytInput.addEventListener('blur', scheduleHide);
  twitchInput.addEventListener('blur', scheduleHide);

  function setPinned(state){
    pinned = state;
    localStorage.setItem('duocast_pinned', state ? '1' : '0');
    pinBtn.classList.toggle('active', state);
    pinBtn.textContent = state ? 'Barra fixa' : 'Fixar barra';
    if (state) showDeck(); else scheduleHide();
  }
  pinBtn.addEventListener('click', function(){ setPinned(!pinned); });

  async function loadYT(rawInput){
    var parsed = await resolveYTInput(rawInput);
    if (!parsed) return;

    if (parsed.type === 'error') {
        alert(parsed.msg);
        return;
    }
    
    ytInput.value = rawInput; 
    
    if (parsed.type === 'channel') {
      ytFrame.src =
        'https://www.youtube.com/embed/live_stream?channel=' +
        encodeURIComponent(parsed.id) +
        '&autoplay=1&playsinline=1';
    } else {
      ytFrame.src =
        'https://www.youtube.com/embed/' +
        encodeURIComponent(parsed.id) +
        '?autoplay=1&playsinline=1';
    }
    
    ytFrame.classList.remove('hidden');
    ytPlaceholder.classList.add('hidden');
    ytLed.classList.add('on-yt');
    localStorage.setItem('duocast_yt', rawInput);
    updateURL('yt', rawInput);
  }

  function loadTwitch(name){
    name = sanitizeTwitch(name);
    if (!name) return;
    twitchInput.value = name;
    var parent = window.location.hostname || 'localhost';
    twitchFrame.src = 'https://www.twitch.tv/embed/' + encodeURIComponent(name) + '/chat?parent=' + parent + '&darkpopout';
    twitchFrame.classList.remove('hidden');
    twitchPlaceholder.classList.add('hidden');
    twitchLed.classList.add('on-twitch');
    localStorage.setItem('duocast_twitch', name);
    updateURL('twitch', name);
  }

  async function loadAll() {
    var ytVal = ytInput.value;
    var twVal = twitchInput.value;
    
    // Feedback visual no botão
    var prevText = loadAllBtn.textContent;
    loadAllBtn.textContent = "Buscando...";
    loadAllBtn.disabled = true;

    try {
      if(twVal) loadTwitch(twVal);
      if(ytVal) await loadYT(ytVal);
    } finally {
      loadAllBtn.textContent = prevText;
      loadAllBtn.disabled = false;
    }
  }

  function updateURL(param, value) {
    var url = new URL(window.location.href);
    url.searchParams.set(param, value);
    window.history.replaceState({}, '', url);
  }

  loadAllBtn.addEventListener('click', loadAll);
  ytInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') loadAll(); });
  twitchInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') loadAll(); });

  var params = new URLSearchParams(window.location.search);
  var initYT = params.get('yt') || localStorage.getItem('duocast_yt');
  var initTwitch = params.get('twitch') || localStorage.getItem('duocast_twitch');
  
  if (initYT) { ytInput.value = initYT; loadYT(initYT); }
  if (initTwitch) { twitchInput.value = initTwitch; loadTwitch(initTwitch); }

  if (pinned) setPinned(true);

  showDeck();
  setTimeout(function(){ if (!pinned) scheduleHide(); }, 2200);
})();
</script>

</body>
</html>
