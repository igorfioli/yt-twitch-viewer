<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DUOCAST — Kick + Twitch</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0a0a0c;
    --panel:#101013;
    --panel-2:#151519;
    --hairline:#1f2025;
    --text:#ececee;
    --text-dim:#6b6f76;
    --kick:#53fc18;
    --kick-dim:#2c8a0d;
    --twitch:#9146ff;
    --twitch-dim:#5c2ba8;
    --danger:#ff4d4d;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--void);
    color:var(--text);
    font-family:'Inter',sans-serif;
    overflow:hidden;
  }
  ::selection{background:var(--kick);color:#04180a;}

  /* ---------- layout skeleton ---------- */
  #stage{
    position:fixed;inset:0;
    display:flex;
    flex-direction:row;
  }
  #kick-pane{
    flex:0 0 68%;
    position:relative;
    background:#000;
    border-right:1px solid var(--hairline);
    min-width:0;
  }
  #twitch-pane{
    flex:1 1 auto;
    position:relative;
    background:var(--panel);
    min-width:0;
  }
  #kick-frame, #twitch-frame{
    width:100%;height:100%;border:0;display:block;
  }

  /* the seam: a live signal-merge indicator between panes */
  #seam{
    position:absolute;
    top:0;bottom:0;
    left:68%;
    width:2px;
    transform:translateX(-1px);
    z-index:5;
    pointer-events:none;
    background:linear-gradient(180deg, var(--kick) 0%, var(--hairline) 45%, var(--hairline) 55%, var(--twitch) 100%);
    opacity:.55;
  }

  /* ---------- empty-state placeholders ---------- */
  .placeholder{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:10px;
    color:var(--text-dim);
    font-family:'JetBrains Mono',monospace;
    text-align:center;
    padding:0 24px;
    background:var(--panel);
  }
  .placeholder .glyph{
    font-size:13px;
    letter-spacing:.14em;
    text-transform:uppercase;
  }
  .placeholder .glyph.kick-c{color:var(--kick-dim);}
  .placeholder .glyph.twitch-c{color:var(--twitch-dim);}
  .placeholder .sub{font-size:12px;color:var(--text-dim);max-width:320px;line-height:1.6;}
  .hidden{display:none !important;}

  /* ---------- top control deck ---------- */
  #hotzone{
    position:fixed;top:0;left:0;right:0;height:14px;z-index:30;
  }
  #deck{
    position:fixed;
    top:0;left:0;right:0;
    z-index:20;
    display:flex;
    align-items:stretch;
    background:rgba(10,10,12,.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--hairline);
    transform:translateY(-100%);
    transition:transform .28s cubic-bezier(.4,0,.2,1);
    font-family:'JetBrains Mono',monospace;
  }
  #deck.visible{transform:translateY(0);}

  .deck-brand{
    display:flex;align-items:center;
    padding:0 18px;
    font-size:13px;
    font-weight:700;
    letter-spacing:.12em;
    color:var(--text);
    border-right:1px solid var(--hairline);
    white-space:nowrap;
  }
  .deck-brand .dot-k{color:var(--kick);}
  .deck-brand .dot-t{color:var(--twitch);}

  .deck-channel{
    flex:1 1 0;
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 16px;
    min-width:0;
    border-right:1px solid var(--hairline);
  }
  .deck-channel:last-of-type{border-right:1px solid var(--hairline);}

  .deck-label{
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--text-dim);
    white-space:nowrap;
    display:flex;align-items:center;gap:6px;
  }
  .led{width:6px;height:6px;border-radius:50%;background:var(--text-dim);flex:none;}
  .led.on-kick{background:var(--kick);box-shadow:0 0 6px var(--kick);}
  .led.on-twitch{background:var(--twitch);box-shadow:0 0 6px var(--twitch);}

  .deck-channel input[type="text"]{
    flex:1 1 auto;
    min-width:60px;
    background:var(--panel-2);
    border:1px solid var(--hairline);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:8px 10px;
    border-radius:3px;
    outline:none;
    transition:border-color .15s;
  }
  #kick-channel:focus{border-color:var(--kick-dim);}
  #twitch-channel:focus{border-color:var(--twitch-dim);}
  .deck-channel input[type="text"]::placeholder{color:var(--text-dim);}

  .deck-go{
    flex:none;
    background:transparent;
    border:1px solid var(--hairline);
    color:var(--text);
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:0 14px;
    height:34px;
    border-radius:3px;
    cursor:pointer;
    transition:all .15s;
    white-space:nowrap;
  }
  #kick-go:hover{border-color:var(--kick);color:var(--kick);}
  #twitch-go:hover{border-color:var(--twitch);color:var(--twitch);}

  .deck-aux{
    display:flex;align-items:center;
    padding:0 16px;
    gap:10px;
  }
  #pin-btn{
    background:transparent;
    border:1px solid var(--hairline);
    color:var(--text-dim);
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    padding:8px 12px;
    border-radius:3px;
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s;
  }
  #pin-btn:hover{color:var(--text);border-color:var(--text-dim);}
  #pin-btn.active{color:var(--void);background:var(--text);border-color:var(--text);}

  /* peek tab shown when deck is hidden */
  #peek{
    position:fixed;top:0;left:50%;transform:translateX(-50%);
    z-index:19;
    background:rgba(10,10,12,.85);
    border:1px solid var(--hairline);
    border-top:none;
    color:var(--text-dim);
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    letter-spacing:.12em;
    text-transform:uppercase;
    padding:4px 14px 5px;
    border-radius:0 0 6px 6px;
    pointer-events:none;
    opacity:.8;
  }
  #deck.visible ~ #peek{display:none;}

  @media (max-width: 760px){
    #stage{flex-direction:column;}
    #kick-pane{flex:0 0 55%;border-right:none;border-bottom:1px solid var(--hairline);}
    #twitch-pane{flex:1 1 auto;}
    #seam{left:0;right:0;top:55%;bottom:auto;height:2px;width:auto;
      background:linear-gradient(90deg, var(--kick) 0%, var(--hairline) 45%, var(--hairline) 55%, var(--twitch) 100%);}
    #deck{flex-wrap:wrap;}
    .deck-brand{width:100%;border-right:none;border-bottom:1px solid var(--hairline);}
    .deck-channel{flex:1 1 100%;border-right:none;border-bottom:1px solid var(--hairline);}
    .deck-aux{width:100%;justify-content:flex-end;}
  }
</style>
</head>
<body>

<div id="stage">
  <div id="kick-pane">
    <iframe id="kick-frame" class="hidden" allowfullscreen title="Kick stream"></iframe>
    <div id="kick-placeholder" class="placeholder">
      <div class="glyph kick-c">Kick — sinal de vídeo</div>
      <div class="sub">Digite o nome do canal na Kick, ali em cima, e aperte carregar.</div>
    </div>
  </div>
  <div id="twitch-pane">
    <iframe id="twitch-frame" class="hidden" title="Twitch chat"></iframe>
    <div id="twitch-placeholder" class="placeholder">
      <div class="glyph twitch-c">Twitch — comentários</div>
      <div class="sub">Digite o nome do canal na Twitch, ali em cima, e aperte carregar.</div>
    </div>
  </div>
  <div id="seam"></div>
</div>

<div id="hotzone"></div>
<div id="peek">passe o mouse aqui em cima</div>

<div id="deck">
  <div class="deck-brand"><span class="dot-k">KICK</span>&nbsp;/&nbsp;<span class="dot-t">TWITCH</span></div>

  <div class="deck-channel">
    <span class="deck-label"><span class="led" id="kick-led"></span>Kick</span>
    <input type="text" id="kick-channel" placeholder="nome do canal na kick" autocomplete="off" spellcheck="false">
    <button class="deck-go" id="kick-go">Carregar</button>
  </div>

  <div class="deck-channel">
    <span class="deck-label"><span class="led" id="twitch-led"></span>Twitch</span>
    <input type="text" id="twitch-channel" placeholder="nome do canal na twitch" autocomplete="off" spellcheck="false">
    <button class="deck-go" id="twitch-go">Carregar</button>
  </div>

  <div class="deck-aux">
    <button id="pin-btn" title="Manter a barra sempre visível">Fixar barra</button>
  </div>
</div>

<script>
(function(){
  var kickFrame = document.getElementById('kick-frame');
  var twitchFrame = document.getElementById('twitch-frame');
  var kickPlaceholder = document.getElementById('kick-placeholder');
  var twitchPlaceholder = document.getElementById('twitch-placeholder');
  var kickInput = document.getElementById('kick-channel');
  var twitchInput = document.getElementById('twitch-channel');
  var kickGo = document.getElementById('kick-go');
  var twitchGo = document.getElementById('twitch-go');
  var kickLed = document.getElementById('kick-led');
  var twitchLed = document.getElementById('twitch-led');
  var deck = document.getElementById('deck');
  var hotzone = document.getElementById('hotzone');
  var pinBtn = document.getElementById('pin-btn');

  var pinned = localStorage.getItem('duocast_pinned') === '1';
  var hideTimer = null;

  function sanitize(name){
    return name.trim().replace(/^@/, '').replace(/https?:\/\/[^\/]+\//, '').replace(/[^a-zA-Z0-9_]/g, '');
  }

  function showDeck(){
    clearTimeout(hideTimer);
    deck.classList.add('visible');
  }
  function scheduleHide(){
    if (pinned) return;
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function(){
      if (document.activeElement === kickInput || document.activeElement === twitchInput) return;
      deck.classList.remove('visible');
    }, 180);
  }

  hotzone.addEventListener('mouseenter', showDeck);
  deck.addEventListener('mouseenter', showDeck);
  deck.addEventListener('mouseleave', scheduleHide);
  hotzone.addEventListener('mouseleave', function(){
    // only schedule hide if the mouse didn't move into the deck itself
    setTimeout(function(){
      if (!deck.matches(':hover')) scheduleHide();
    }, 30);
  });

  kickInput.addEventListener('focus', showDeck);
  twitchInput.addEventListener('focus', showDeck);
  kickInput.addEventListener('blur', scheduleHide);
  twitchInput.addEventListener('blur', scheduleHide);

  function setPinned(state){
    pinned = state;
    localStorage.setItem('duocast_pinned', state ? '1' : '0');
    pinBtn.classList.toggle('active', state);
    pinBtn.textContent = state ? 'Barra fixa' : 'Fixar barra';
    if (state) showDeck(); else scheduleHide();
  }
  pinBtn.addEventListener('click', function(){ setPinned(!pinned); });

  function loadKick(name){
    name = sanitize(name);
    if (!name) return;
    kickInput.value = name;
    kickFrame.src = 'https://player.kick.com/' + encodeURIComponent(name) + '?autoplay=true';
    kickFrame.classList.remove('hidden');
    kickPlaceholder.classList.add('hidden');
    kickLed.classList.add('on-kick');
    localStorage.setItem('duocast_kick', name);
    var url = new URL(window.location.href);
    url.searchParams.set('kick', name);
    window.history.replaceState({}, '', url);
  }

  function loadTwitch(name){
    name = sanitize(name);
    if (!name) return;
    twitchInput.value = name;
    var parent = window.location.hostname || 'localhost';
    twitchFrame.src = 'https://www.twitch.tv/embed/' + encodeURIComponent(name) + '/chat?parent=' + parent + '&darkpopout';
    twitchFrame.classList.remove('hidden');
    twitchPlaceholder.classList.add('hidden');
    twitchLed.classList.add('on-twitch');
    localStorage.setItem('duocast_twitch', name);
    var url = new URL(window.location.href);
    url.searchParams.set('twitch', name);
    window.history.replaceState({}, '', url);
  }

  kickGo.addEventListener('click', function(){ loadKick(kickInput.value); });
  twitchGo.addEventListener('click', function(){ loadTwitch(twitchInput.value); });
  kickInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') loadKick(kickInput.value); });
  twitchInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') loadTwitch(twitchInput.value); });

  // restore from URL params first, then localStorage
  var params = new URLSearchParams(window.location.search);
  var initKick = params.get('kick') || localStorage.getItem('duocast_kick');
  var initTwitch = params.get('twitch') || localStorage.getItem('duocast_twitch');
  if (initKick) { kickInput.value = initKick; loadKick(initKick); }
  if (initTwitch) { twitchInput.value = initTwitch; loadTwitch(initTwitch); }

  if (pinned) setPinned(true);

  // show the deck briefly on load so the user notices it
  showDeck();
  setTimeout(function(){ if (!pinned) scheduleHide(); }, 2200);
})();
</script>

</body>
</html>
